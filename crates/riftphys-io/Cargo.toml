[package]
name = "riftphys-io"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gltf = "1"

# For rig_physics module
glam = { workspace = true }
riftphys-core = { path = "../riftphys-core" }
riftphys-geom = { path = "../riftphys-geom" }
riftphys-world = { path = "../riftphys-world" }
riftphys-articulation = { path = "../riftphys-articulation" }
riftphys-materials = { path = "../riftphys-materials" }
clap = { version = "4.5.23", features = ["derive"] }

[dev-dependencies]
clap = { version = "4", features = ["derive"] }
